<svg xmlns="http://www.w3.org/2000/svg" width="340" height="64" viewBox="0 0 340 64" fill="none">
  <defs>
    <linearGradient id="btn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .tn-container {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }
    .btn-container:hover {
      transform: translateY(-2px);
    }
    .flame {
      animation: thrust 0.8s ease-in-out infinite alternate;
      transform-origin: 44px 34px;
    }
    @keyframes thrust {
      0% { transform: scale(0.9) translateY(0); opacity: 0.8; }
      100% { transform: scale(1.15) translateY(2px); opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
    }
    .spark {
      animation: sparkle 1.2s infinite ease-out;
    }
    @keyframes sparkle {
      0% { transform: translate(0, 0); opacity: 1; }
      100% { transform: translate(-10px, 8px); opacity: 0; }
    }
  </style>

  <g class="btn-container">
    <!-- Outer Glow -->
    <rect x="3" y="3" width="334" height="58" rx="29" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" filter="url(#glow)"/>
    
    <!-- Button Body -->
    <rect x="4" y="4" width="332" height="56" rx="28" fill="url(#btn-bg)" stroke="#334155" stroke-width="1.5"/>

    <!-- Rocket Icon Pod -->
    <g transform="translate(24, 14)">
      <!-- Jet Thrust Flame -->
      <path class="flame" d="M12 24 C10 29 8 33 12 36 C16 33 14 29 12 24 Z" fill="url(#flame-grad)" />
      
      <!-- Rocket Body -->
    <path d="M12 2 C8 7 7 14 6 18 L18 18 C17 14 16 7 12 2 Z" fill="#38bdf8"/>
      <!-- Fins -->
      <path d="M6 14 L2 19 L6 19 Z" fill="#0284c7"/>
      <path d="M18 14 L22 19 L18 19 Z" fill="#0284c7"/>
      <!-- Window -->
      <circle cx="12" cy="10" r="2.5" fill="#0f172a"/>
    </g>

    <!-- Button Text -->
    <text x="68" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fafc" letter-spacing="0.3">
      Explore Interactive Portfolio
    </text>
    <text x="296" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#38bdf8" font-weight="bold">
      ↗
    </text>
  </g>
</svg>